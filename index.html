<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ここらぼ直伝！魂商品作成ミラクルキット</title>
<meta name="description" content="商品をカタチにする10の扉。10個の問いに答えながら、あなたの商品に一本の芯を通していこう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="app-header" id="appHeader" hidden>
  <div class="app-header__inner">
    <p class="app-header__brand">ここらぼ直伝！ 魂商品作成ミラクルキット</p>
    <div class="progress" role="progressbar" aria-label="魂商品 完成度" aria-valuemin="0" aria-valuemax="100" id="progressBar">
      <div class="progress__track">
        <div class="progress__fill" id="progressFill"></div>
      </div>
      <div class="progress__row">
        <p class="progress__label" id="progressLabel">魂商品 完成度 0％</p>
        <p class="progress__door" id="progressDoor"></p>
      </div>
    </div>
  </div>
</header>

<main id="app" class="app-main"></main>

<footer class="app-footer">
  <p>© ここらぼ｜魂商品作成ミラクルキット</p>
</footer>

<!-- 全消去の確認モーダル -->
<div class="modal-overlay" id="resetModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <p class="modal__eyebrow">ちょっと待った🤣</p>
    <h2 id="resetModalTitle">最初からやり直しますか？</h2>
    <p class="modal__body">これまで入力した内容は、すべて消えてしまいます。<br>本当に最初からやり直しますか？</p>
    <div class="modal__actions">
      <button class="btn btn--ghost" id="resetCancelBtn" type="button">やめておく</button>
      <button class="btn btn--danger" id="resetConfirmBtn" type="button">最初からやり直す</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
